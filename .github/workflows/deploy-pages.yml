name: Deploy GitHub Pages (wireframes + prototypes)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all prototypes
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          rm -rf site
          mkdir -p site

          # Copy hub/landing pages
          cp -R pages/* site/

          # For projects that output to ./build
          build_one () {
            local dir="$1"
            local subpath="$2"
            pushd "$dir" >/dev/null
            npm install --no-fund --no-audit
            BASE_PATH="/${REPO_NAME}/${subpath}/" npm run build
            popd >/dev/null

            mkdir -p "site/${subpath}"
            cp -R "${dir}/build"/* "site/${subpath}/"
          }

          # For Vite projects that output to ./dist
          build_one_vite () {
            local dir="$1"
            local subpath="$2"
            pushd "$dir" >/dev/null
            npm install --no-fund --no-audit
            BASE_PATH="/${REPO_NAME}/${subpath}/" npm run build
            popd >/dev/null

            mkdir -p "site/${subpath}"
            cp -R "${dir}/dist"/* "site/${subpath}/"
          }

          # Existing build/ folder projects
          build_one tree tree
          build_one interactive interactive
          build_one everyone everyone
          build_one wireframe-lowfi wireframe-lowfi
          build_one wireframe-intent wireframe-intent
          build_one wireframe-final-v2 wireframe-final-v2

          # Existing and new Vite/dist projects
          build_one_vite contributor-pathway-lowfi contributor-pathway-lowfi
          build_one_vite educator-path-1 educator-path-1
          build_one_vite educator-path-2 educator-path-2
          build_one_vite final-v1 final-v1
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4